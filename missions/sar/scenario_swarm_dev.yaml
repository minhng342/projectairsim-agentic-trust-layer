# Phase 3 development scenario: three honest drones on the dev mission. Same seed and the
# same victim draw as scenario_dev.yaml (run i of both has the same victim), so a Phase 3
# run pairs with the Phase 1/2 run of the same index.
# Starts are spread along the south edge (x = 0) so the first Voronoi split gives each drone
# a strip of columns; three drones on one pad would give two of them empty cells.
# Live: sim_config/scene_sar_three_drones.jsonc spawns Drone1..3 at these points; check in
# CityEnviron that they are clear before the first flight (the runner refuses to fly if a
# drone spawns more than 5 m from its start).
scenario_id: sc-swarm-dev
seed: 42
runs: 20
randomize_victim: true
victim_edge_margin_m: 1.0
drones:
  - id: A
    vehicle: Drone1
    start: {x_m: 0, y_m: 30}
  - id: B
    vehicle: Drone2
    start: {x_m: 0, y_m: 80}
  - id: C
    vehicle: Drone3
    start: {x_m: 0, y_m: 130}
insider:
  enabled: false
